  <title>Covilhã Mobilidade Notices Archive</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #dfe3ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; }
    .home-link {
      display: inline-block;
      text-decoration: none;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 600;
    }
    .archive-list {
      display: grid;
      gap: 12px;
    }
    .archive-item {
      display: block;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
    }
  </style>
</head>
